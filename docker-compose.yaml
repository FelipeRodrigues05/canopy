name: canopy

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://canopy_app:app@postgres:5432/canopy
  MIGRATOR_DATABASE_URL: postgres://canopy_migrator:migrator@postgres:5432/canopy
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AUTH_ENABLED: "true"
  # Tokens carry the issuer the client used (localhost from the host); keys are fetched inside the network.
  AUTH_ISSUER: http://localhost:8080/realms/wagering
  AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
  AUTH_AUDIENCE: canopy-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CANOPY_DATABASES: canopy
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-canopy.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canopy"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pinned to the last community release that runs without LOCALSTACK_AUTH_TOKEN.
  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    volumes:
      - ./infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events.fifo >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Identity provider. Realm "wagering" with one client per provider (client
  # credentials) and a provider_id claim; dev mode, imported on start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak/realm-wagering.json:/opt/keycloak/data/import/realm-wagering.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # `docker compose up --scale app=3` runs three instances (host ports 3000-3002).
  app:
    build: .
    environment:
      <<: *app-env
      APP_ROLES: api,consumer,workers
      PORT: 3000
    ports: ["3000-3002:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

volumes:
  pgdata:
