name: ci

# Runs on every PR and on pushes to the main branches. Tests run against the
# committed tree with real Postgres, LocalStack and Keycloak containers.
on:
  pull_request:
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: typecheck, lint, architecture rules, unit tests
        run: bun run check

  integration:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: integration (real Postgres, LocalStack, Keycloak)
        run: bun run test:integration
      - name: concurrency (same process + 3 OS processes)
        run: bun run test:concurrency
      - name: container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yaml logs --tail 200
