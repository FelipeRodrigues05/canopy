# Load balancer for the load test: round-robin over every `app` replica.
# Docker DNS returns one A record per replica; nginx resolves them at start.
worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;
  upstream canopy {
    server app:3000;
    keepalive 128;
    keepalive_timeout 30s;   # below the app's 65 s keepAliveTimeout
  }
  server {
    listen 80;
    location / {
      proxy_pass http://canopy;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Correlation-Id $request_id;
    }
  }
}
